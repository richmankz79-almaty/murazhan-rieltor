    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Шапка */
        .header {
            background: #1a3a5c;
            color: white;
            padding: 20px 0 15px 0;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        
        .back-link {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffd700;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 8px 16px;
            border: 2px solid #ffd700;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: #ffd700;
            color: #1a3a5c;
        }
        
        /* Заголовок страницы */
        .page-title {
            background: linear-gradient(135deg, #1a3a5c 0%, #2a5a8c 100%);
            color: white;
            padding: 40px 0;
            text-align: center;
        }
        
        .page-title h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .page-title p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        /* Сетка с объявлениями */
        .property-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            padding: 40px 0;
        }
        
        /* Карточка объявления */
        .property-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #f0f0f0;
        }
        
        .property-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        
        .property-header {
            background: linear-gradient(135deg, #1a3a5c 0%, #2a5a8c 100%);
            color: white;
            padding: 15px 20px;
        }
        
        .property-header h3 {
            margin: 0;
            font-size: 1.2em;
            font-weight: 600;
        }
        
        .property-body {
            padding: 20px;
        }
        
        .property-price {
            font-size: 1.8em;
            font-weight: 700;
            color: #1a3a5c;
            margin: 10px 0;
        }
        
        .property-price small {
            font-size: 0.5em;
            font-weight: 400;
            color: #718096;
        }
        
        .property-details {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 10px 0 15px 0;
            padding: 10px 0;
            border-top: 1px solid #edf2f7;
            border-bottom: 1px solid #edf2f7;
        }
        
        .property-details span {
            background: #f7fafc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #4a5568;
        }
        
        .property-address {
            color: #4a5568;
            font-size: 0.95em;
            margin: 10px 0;
            padding: 10px;
            background: #f7fafc;
            border-radius: 8px;
        }
        
        .property-description {
            color: #555;
            font-size: 0.9em;
            line-height: 1.6;
            margin: 10px 0;
        }
        
        .property-features {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #edf2f7;
            font-size: 0.9em;
            color: #444;
        }
        
        .property-features strong {
            color: #1a3a5c;
        }
        
        .badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            margin-right: 5px;
        }
        
        .badge.deposit {
            background: #ed8936;
        }
        
        /* Кнопка "Назад" на мобильных */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }
            .back-link {
                position: static;
                display: inline-block;
                margin-top: 10px;
                transform: none;
                font-size: 16px;
                padding: 6px 14px;
            }
            .page-title h2 {
                font-size: 28px;
            }
            .property-grid {
                grid-template-columns: 1fr;
                padding: 20px 0;
            }
        }
    </style>
</head>

    // Функция для отображения объявлений
    function displayProperties() {
        const container = document.getElementById('properties-container');
        if (!container) return;

        container.innerHTML = '';

        properties.forEach(prop => {
            const card = document.createElement('div');
            card.className = 'property-card';
            
            card.innerHTML = `
                <div class="property-header">
                    <h3>${prop.rooms}</h3>
                </div>
                <div class="property-body">
                    <div class="property-price">
                        ${prop.price} <small>/ месяц</small>
                    </div>
                    <div class="property-details">

                        <span>🏢 ${prop.floor}</span>
                    </div>
                    <div class="property-address">

                    </div>
                    <div class="property-description">

                    </div>
                    <div class="property-features">
                        <strong>Особенности:</strong><br>
                        ${prop.features}
                    </div>
                </div>
            `;
            
            container.appendChild(card);
